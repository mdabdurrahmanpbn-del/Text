<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Learning App</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#89f7fe,#66a6ff);
}

header{
background:#ff5722;
color:white;
text-align:center;
padding:18px;
font-size:26px;
font-weight:bold;
letter-spacing:1px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

/* 🔥 SMALLER CARD */
.card{
background:white;
padding:25px 15px;   /* ⬅️ ছোট করা হয়েছে */
border-radius:18px;
text-align:center;

font-size:18px;      /* ⬅️ ছোট করা হয়েছে */
font-weight:bold;
cursor:pointer;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:8px;

box-shadow:0 8px 18px rgba(0,0,0,0.2);
transition:0.3s;
}

/* ICON SMALL */
.card span{
font-size:35px;
}

.card:hover{
transform:translateY(-6px) scale(1.04);
box-shadow:0 12px 25px rgba(0,0,0,0.3);
}

/* COLORS */
.card:nth-child(1){background:#ffccbc;}
.card:nth-child(2){background:#c8e6c9;}
.card:nth-child(3){background:#bbdefb;}
.card:nth-child(4){background:#f8bbd0;}
.card:nth-child(5){background:#d1c4e9;}
.card:nth-child(6){background:#fff59d;}
.card:nth-child(7){background:#b2ebf2;}
.card:nth-child(8){background:#ffcdd2;}
.card:nth-child(9){background:#dcedc8;}
.card:nth-child(10){background:#e1bee7;}
.card:nth-child(11){background:#b3e5fc;}
.card:nth-child(12){background:#c5e1a5;}

</style>
</head>

<body>

<header>🎓 Kids Learning App</header>

<div class="menu">

<!-- ✅ আগের সব ঠিক আছে -->

<div class="card" onclick="openPage('alphabet.html')">
<span>🔤</span>
Alphabet
</div>

<div class="card" onclick="openPage('bangla.html')">
<span>🇧🇩</span>
Bangla
</div>

<div class="card" onclick="openPage('number.html')">
<span>🔢</span>
Number
</div>

<div class="card" onclick="openPage('writing.html')">
<span>✍️</span>
Writing
</div>

<div class="card" onclick="openPage('quiz.html')">
<span>🧠</span>
Quiz
</div>

<div class="card" onclick="openPage('game.html')">
<span>🎮</span>
Game
</div>

<div class="card" onclick="openPage('calendar.html')">
<span>📅</span>
Calendar
</div>

<div class="card" onclick="openPage('drawing.html')">
<span>🎨</span>
Drawing
</div>

<div class="card" onclick="openPage('about.html')">
<span>ℹ️</span>
About
</div>

<!-- 🔥 NEW PAGES -->

<div class="card" onclick="openPage('story.html')">
<span>📖</span>
Story
</div>

<div class="card" onclick="openPage('rhymes.html')">
<span>🎵</span>
Rhymes
</div>

<div class="card" onclick="openPage('puzzle.html')">
<span>🧩</span>
Puzzle
</div>

</div>

<script>
function openPage(page){
window.location.href = page;
}
</script>

</body>
</html>
